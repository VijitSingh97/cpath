name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils shellcheck
      - name: Validate release version and build package
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test "$(bin/cpath --version)" = "cpath $(cat VERSION)"
          make test lint deb
          dpkg-deb --info dist/*.deb
      - name: Import signing key and build APT feed
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          ./scripts/build-apt.sh
          gpg --verify public/InRelease
      - name: Verify the signed feed with APT
        run: |
          state=$(mktemp -d)
          chmod 755 "$state"
          mkdir -p "$state/lists/partial" "$state/download"
          printf 'deb [signed-by=%s/public/cpath.asc] file:%s/public ./\n' "$PWD" "$PWD" > "$state/sources.list"
          options=(-o "Dir::Etc::sourcelist=$state/sources.list" -o Dir::Etc::sourceparts=- -o "Dir::State::lists=$state/lists")
          sudo apt-get "${options[@]}" update
          cd "$state/download"
          sudo apt-get "${options[@]}" download cpath
          dpkg-deb --info ./*.deb
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.deb SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "cpath $GITHUB_REF_NAME" \
            --notes 'Copy canonical file and directory paths on macOS, Ubuntu, and Debian. Includes zsh completion, Homebrew installation, and a signed APT feed. See the README for installation and usage.'
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy signed APT feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
